<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- CropWat Auto-runner v1.0 — หยดน้ำ (water) มีต้นกล้า (crop) อยู่ข้างใน
       ใช้เป็นต้นแบบของ backend/assets/app.ico และโลโก้ในหน้าเว็บด้วย -->
  <defs>
    <linearGradient id="cw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13324a"/>
      <stop offset="1" stop-color="#0a5a55"/>
