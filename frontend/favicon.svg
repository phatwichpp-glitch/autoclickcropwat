  <rect width="512" height="512" rx="116" fill="url(#cw-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#cw-glow)"/>
  <!-- หยดน้ำ: ยอดแหลม (256,52) สัมผัสวงกลม c=(256,316) r=142 -->
