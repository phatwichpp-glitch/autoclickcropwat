  <path d="M256 356 C222 356 180 330 176 278 C228 276 254 308 256 356 Z" fill="url(#cw-leaf)"/>
  <path d="M256 330 C263 276 301 244 350 246 C348 298 306 330 256 330 Z" fill="url(#cw-leaf)"/>
